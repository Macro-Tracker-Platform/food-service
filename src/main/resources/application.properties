spring.application.name=macro-tracker-food-service

spring.threads.virtual.enabled=true

spring.data.mongodb.uri=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_NAME}
spring.data.mongodb.auto-index-creation=true

spring.elasticsearch.uris=${ELASTICSEARCH_URIS}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

gemini.base-url=${GEMINI_BASE_URL}
gemini.generate-content-path=${GEMINI_GENERATE_CONTENT_PATH:/gemini/models/gemini-2.5-flash:generateContent}
gemini.api-key=${GEMINI_API_KEY}
gemini.nutrition-label-prompt=${GEMINI_NUTRITION_LABEL_PROMPT}
gemini.food-photo-prompt=${GEMINI_FOOD_PHOTO_PROMPT:Identify all visible foods. Return only JSON matching the supplied schema. Set image_quality to blurred and return an empty items array when the image is too blurred or unclear for reliable food identification. Otherwise set image_quality to usable. Use standardized search-friendly names, estimate edible weight in grams, confidence, and serving nutrition. Classify barcode-only images as barcode and non-food images as not_food.}
gemini.nutrition-label-scan.request-daily-limit=${NUTRITION_LABEL_SCAN_REQUEST_DAILY_LIMIT:50}
gemini.nutrition-label-scan.free-successful-monthly-limit=${NUTRITION_LABEL_SCAN_FREE_SUCCESSFUL_MONTHLY_LIMIT:3}
gemini.nutrition-label-scan.pro-successful-daily-limit=${NUTRITION_LABEL_SCAN_PRO_SUCCESSFUL_DAILY_LIMIT:30}
gemini.nutrition-label-scan.max-image-width=${NUTRITION_LABEL_SCAN_MAX_IMAGE_WIDTH:1280}
gemini.nutrition-label-scan.max-image-height=${NUTRITION_LABEL_SCAN_MAX_IMAGE_HEIGHT:1280}
gemini.nutrition-label-scan.image-quality=${NUTRITION_LABEL_SCAN_IMAGE_QUALITY:0.75}
gemini.nutrition-label-scan.max-output-tokens=${NUTRITION_LABEL_SCAN_MAX_OUTPUT_TOKENS:128}
gemini.nutrition-label-scan.thinking-budget=${NUTRITION_LABEL_SCAN_THINKING_BUDGET:0}
gemini.nutrition-label-scan.temperature=${NUTRITION_LABEL_SCAN_TEMPERATURE:0.0}
gemini.nutrition-label-scan.response-mime-type=${NUTRITION_LABEL_SCAN_RESPONSE_MIME_TYPE:application/json}
gemini.nutrition-label-scan.default-retry-after-seconds=${GEMINI_DEFAULT_RETRY_AFTER_SECONDS:60}
gemini.nutrition-label-scan.rate-limit-zone=${NUTRITION_LABEL_SCAN_RATE_LIMIT_ZONE:UTC}
gemini.food-photo-scan.premium-daily-limit=${FOOD_PHOTO_SCAN_PREMIUM_DAILY_LIMIT:30}
gemini.food-photo-scan.max-image-width=${FOOD_PHOTO_SCAN_MAX_IMAGE_WIDTH:1280}
gemini.food-photo-scan.max-image-height=${FOOD_PHOTO_SCAN_MAX_IMAGE_HEIGHT:1280}
gemini.food-photo-scan.image-quality=${FOOD_PHOTO_SCAN_IMAGE_QUALITY:0.75}
gemini.food-photo-scan.max-output-tokens=${FOOD_PHOTO_SCAN_MAX_OUTPUT_TOKENS:1024}
gemini.food-photo-scan.thinking-budget=${FOOD_PHOTO_SCAN_THINKING_BUDGET:0}
gemini.food-photo-scan.temperature=${FOOD_PHOTO_SCAN_TEMPERATURE:0.0}
gemini.food-photo-scan.response-mime-type=application/json
gemini.food-photo-scan.quota-zone=${FOOD_PHOTO_SCAN_QUOTA_ZONE:UTC}
gemini.food-photo-scan.match-threshold=${FOOD_PHOTO_SCAN_MATCH_THRESHOLD:0.85}
gemini.food-photo-scan.history-limit=${FOOD_PHOTO_SCAN_HISTORY_LIMIT:50}
gemini.food-photo-scan.global-candidate-limit=${FOOD_PHOTO_SCAN_CANDIDATE_LIMIT:10}
gemini.food-photo-scan.reservation-ttl-seconds=${FOOD_PHOTO_SCAN_RESERVATION_TTL_SECONDS:180}
gemini.food-photo-scan.max-concurrent-scans=${FOOD_PHOTO_SCAN_MAX_CONCURRENT:32}
gemini.food-photo-scan.max-decoded-pixels=${FOOD_PHOTO_SCAN_MAX_DECODED_PIXELS:20000000}
gemini.food-photo-scan.idempotency-ttl-hours=${FOOD_PHOTO_SCAN_IDEMPOTENCY_TTL_HOURS:24}

spring.data.redis.url=${REDIS_URL}
feign.user-service=${USER_SERVICE_URL:http://localhost:8080}
feign.intake-service=${INTAKE_SERVICE_URL:http://localhost:8081}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.gemini-api.connect-timeout=3000
spring.cloud.openfeign.client.config.gemini-api.read-timeout=60000
spring.cloud.openfeign.client.config.user-service.read-timeout=3000
spring.cloud.openfeign.client.config.intake-history.read-timeout=2500
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.httpclient.max-connections=200
spring.cloud.openfeign.httpclient.max-connections-per-route=50

aws.region=${AWS_S3_REGION}
aws.s3bucket=${AWS_S3_BUCKET}
aws.credentials.accessKey=${AWS_S3_ACCESS_KEY}
aws.credentials.secretKey=${AWS_S3_SECRET_KEY}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
swagger.public-url=${MACRO_TRACKER_URL}

logging.level.root=INFO

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
spring.cloud.discovery.enabled=false

app.idempotency.enabled=true
