spring.application.name=macro-tracker-food-service

spring.threads.virtual.enabled=true

spring.data.mongodb.uri=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_NAME}

spring.elasticsearch.uris=${ELASTICSEARCH_URIS}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

gemini.base-url=${GEMINI_BASE_URL}
gemini.generate-content-path=${GEMINI_GENERATE_CONTENT_PATH:/gemini/models/gemini-2.5-flash:generateContent}
gemini.api-key=${GEMINI_API_KEY}
gemini.nutrition-label-prompt=${GEMINI_NUTRITION_LABEL_PROMPT}
gemini.nutrition-label-scan.daily-limit=${NUTRITION_LABEL_SCAN_DAILY_LIMIT:10}
gemini.nutrition-label-scan.max-image-width=${NUTRITION_LABEL_SCAN_MAX_IMAGE_WIDTH:1280}
gemini.nutrition-label-scan.max-image-height=${NUTRITION_LABEL_SCAN_MAX_IMAGE_HEIGHT:1280}
gemini.nutrition-label-scan.image-quality=${NUTRITION_LABEL_SCAN_IMAGE_QUALITY:0.75}
gemini.nutrition-label-scan.max-output-tokens=${NUTRITION_LABEL_SCAN_MAX_OUTPUT_TOKENS:128}
gemini.nutrition-label-scan.thinking-budget=${NUTRITION_LABEL_SCAN_THINKING_BUDGET:0}
gemini.nutrition-label-scan.temperature=${NUTRITION_LABEL_SCAN_TEMPERATURE:0.0}
gemini.nutrition-label-scan.response-mime-type=${NUTRITION_LABEL_SCAN_RESPONSE_MIME_TYPE:application/json}
gemini.nutrition-label-scan.default-retry-after-seconds=${GEMINI_DEFAULT_RETRY_AFTER_SECONDS:60}
gemini.nutrition-label-scan.rate-limit-zone=${NUTRITION_LABEL_SCAN_RATE_LIMIT_ZONE:UTC}

spring.data.redis.url=${REDIS_URL}

spring.servlet.multipart.max-file-size=5MB

aws.region=${AWS_S3_REGION}
aws.s3bucket=${AWS_S3_BUCKET}
aws.credentials.accessKey=${AWS_S3_ACCESS_KEY}
aws.credentials.secretKey=${AWS_S3_SECRET_KEY}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
swagger.public-url=${MACRO_TRACKER_URL}

logging.level.root=INFO
logging.level.com.olehprukhnytskyi.macrotrackeruserservice=INFO

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
spring.cloud.discovery.enabled=false

app.idempotency.enabled=true
