databaseChangeLog:
  - changeSet:
      id: 20260925-1-create-food-reports
      author: codex
      changes:
        - createTable:
            tableName: food_reports
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: food_reports_pkey
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: food_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: food_reports
            columnNames: user_id, food_id
            constraintName: food_reports_user_food_unique
        - createIndex:
            tableName: food_reports
            indexName: food_reports_food_id_idx
            columns:
              - column:
                  name: food_id
